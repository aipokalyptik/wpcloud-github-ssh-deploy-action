name: WP Cloud SSH Deploy
description: Deploy a repository snapshot to a WP Cloud or Pressable docroot over SSH.

inputs:
  host:
    description: SSH host name.
    required: true
  port:
    description: SSH port.
    required: false
    default: "22"
  username:
    description: SSH username.
    required: true
  password:
    description: SSH password.
    required: false
    default: ""
  private-key:
    description: OpenSSH private key content. Mutually exclusive with password.
    required: false
    default: ""
  private-key-passphrase:
    description: Optional passphrase for encrypted private-key authentication.
    required: false
    default: ""
  docroot:
    description: Remote document root, such as /srv/htdocs.
    required: false
    default: /srv/htdocs
  source:
    description: Local source path to deploy.
    required: false
    default: .
  exclude:
    description: Newline-delimited rsync exclude patterns. Omit for built-in defaults; set to "none" to disable excludes.
    required: false
    default: ""
  keep-releases:
    description: Number of remote releases to keep.
    required: false
    default: "2"
  post-deploy:
    description: Optional newline-delimited commands to run on the remote host after deploy.
    required: false
    default: ""
  deployment-id:
    description: Optional stable deployment namespace. Defaults to the normalized repository slug.
    required: false
    default: ""
  known-hosts:
    description: Optional known_hosts content. If omitted, ssh-keyscan is used for host key discovery.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run SSH deploy transport
      shell: bash
      env:
        INPUT_HOST: ${{ inputs.host }}
        INPUT_PORT: ${{ inputs.port }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_PRIVATE_KEY: ${{ inputs.private-key }}
        INPUT_PRIVATE_KEY_PASSPHRASE: ${{ inputs.private-key-passphrase }}
        INPUT_DOCROOT: ${{ inputs.docroot }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_KEEP_RELEASES: ${{ inputs.keep-releases }}
        INPUT_POST_DEPLOY: ${{ inputs.post-deploy }}
        INPUT_DEPLOYMENT_ID: ${{ inputs.deployment-id }}
        INPUT_KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: ${{ github.action_path }}/scripts/deploy.sh
